version: '3.9'

services:
  # ─────────────────────────────────────────────────────────────────
  # MongoDB — single container, multiple logical databases
  # ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: nearmart_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-nearmart_secret}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - nearmart_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # Redis — session + cart cache
  # ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: nearmart_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-nearmart_redis}
    volumes:
      - redis_data:/data
    networks:
      - nearmart_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nearmart_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────
  # RabbitMQ — event bus with management UI on port 15672
  # ─────────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: nearmart_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-nearmart}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-nearmart_rabbit}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-nearmart}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - nearmart_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5

# ─────────────────────────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────────────────────────
volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:

# ─────────────────────────────────────────────────────────────────
# Network
# ─────────────────────────────────────────────────────────────────
networks:
  nearmart_net:
    driver: bridge
